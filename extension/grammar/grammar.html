<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Langtitles library</title>
  <link rel="stylesheet" href="grammar.css">
  <link rel="stylesheet" href="../shared/pages.css">
</head>
<body>
  <div class="layout">
    <aside>
      <h1>Library</h1>
      <p class="sub" id="count"></p>
      <p class="fix-note" id="fixNote" hidden></p>
      <div id="kinds" class="seg"></div>
      <input id="search" type="search" placeholder="Search guides" autocomplete="off">
      <div id="langs" class="langs"></div>
      <button id="checkup" class="checkup-btn" type="button">Check my guides</button>
      <div id="sort" class="sort"><button data-sort="group" class="on">Grouped</button><button data-sort="az">A–Z</button><button data-sort="recent">Recent</button></div>
      <nav id="list"></nav>
    </aside>
    <main id="view">
      <div class="empty" id="empty">
        <h2>No guides yet</h2>
        <p>While watching, rest the pointer on a word, or click a guide in its <span class="chip">Guides</span> row: the book for the word itself, or one of its grammar forms. Langtitles writes each guide once and keeps it here.</p>
      </div>
    </main>
  </div>
  <script src="../shared/settings.js"></script>
  <script src="../shared/lang.js"></script>
  <script src="../shared/guidetext.js"></script>
  <script src="../shared/grammar-ids.js"></script>
  <script src="../shared/guide.js"></script>
  <script src="../background/cache.js"></script>
  <script src="../shared/frames.js"></script>
  <script src="grammar.js"></script>
</body>
</html>
